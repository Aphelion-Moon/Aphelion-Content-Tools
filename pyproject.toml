[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aphelion-content-tools"
version = "0.1.0"
description = "Local authoring and maintenance tools for Meridian-Rift's modular content."
requires-python = ">=3.11"
dependencies = [
    "Pillow==11.3.0",
    "lancedb==0.37.1",
    "fastembed==0.8.0",
    "numpy==2.2.4",
	"fastapi==0.141.1",
	"uvicorn[standard]==0.52.4",
	"pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pyright==1.1.406",
	"pytest==8.4.2",
    "ruff==0.14.2",
    # Starlette's TestClient drives the app in-process for webapp/tests/test_api.py.
	"httpx2==2.12.0",
]

[project.scripts]
aphelion-serve = "webapp.serve_api:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webapp*", "tools*"]
exclude = ["webapp.store.dm*", "webapp.store.definition-editor*"]

[tool.setuptools.package-data]
webapp = ["frontend/dist/**/*"]
"tools.definition_editor" = ["runtime/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
indent-width = 4

[tool.ruff.format]
# This codebase is tab-indented throughout (inherited from the game repository's DM style). Keep it.
indent-style = "tab"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 (line-too-long) is measured against tab-expanded width, which flags ~100 lines that are well under
# the limit as written. The codebase's real p95 line length is 94 characters. Correctness lints (F, B) and
# import hygiene (I) are the value here; re-enable E501 if the frontend rewrite ever normalises indentation.
ignore = ["E501"]

[tool.pyright]
include = [
	"tools/definition_editor",
	"webapp/application_search.py",
	"webapp/capabilities.py",
	"webapp/api/routes/definitions.py",
	"webapp/api/app.py",
	"webapp/api/deps.py",
	"webapp/api/errors.py",
	"webapp/api/models.py",
	"webapp/api/local_security.py",
	"webapp/game_changes.py",
	"webapp/store/generations.py",
	"webapp/store/lifecycle.py",
	"tools/lore_editor/write_coordinator.py",
	"webapp/api/routes/collaboration.py",
	"webapp/api/routes/export.py",
	"webapp/api/routes/git.py",
	"webapp/api/routes/graph.py",
	"webapp/api/routes/store.py",
	"webapp/git_adapter.py",
	"webapp/process_tree.py",
	"webapp/store/health.py",
	"webapp/store/metadata.py",
	"webapp/store/search.py",
	"webapp/workspace_lock.py",
	"tools/lore_editor/app/manifest.py",
	"tools/lore_editor/catalog.py",
	"tools/lore_editor/catalog_seed.py",
	"tools/lore_editor/export.py",
	"tools/lore_editor/reconcile.py",
	"tools/lore_editor/records.py",
	"tools/content_graph/graph.py",
	"tools/content_graph/marker_edit.py",
	"tools/content_graph/markers.py",
	"tools/content_graph/models.py",
	"tools/content_graph/queries.py",
	"tools/content_graph/scanner.py",
]
exclude = [
	"**/__pycache__",
	"**/node_modules",
	"**/tests",
	"webapp/frontend",
	# Vendored legacy parser slated for replacement; it has no annotations and overwhelms useful findings.
	"tools/dmi",
]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# lancedb/pyarrow/fastembed ship partial or absent type stubs; without this every call into them is an
# error rather than the intended `Unknown`, which would bury real findings in third-party noise.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
